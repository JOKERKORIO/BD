<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Adopción de animales</title>
  <style>
    body {
      font-family: Arial;
      background-color: #;
      text-align: center;
    }

    h1 {
      color: #c0654a;
    }

    .animal {
      background: LightCoral;
      border: 2px solid #ccc;
      margin: 5px;
      padding: 5px;
      display: inline-block;
      width: 200px;
    }

    button {
      background: #c0654a;
      color: rose;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }

    form {
      margin-top: 20px;
      background: white;
      padding: 15px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <h1>Centro de Adopción</h1>

  <h2>Animales disponibles</h2>

  <div class="animal">
    <p>🐶 Bruno</p>
    <p>Labrador</p>
    <button onclick="adoptar('Bruno')">Adoptar</button>
  </div>

  <div class="animal">
    <p>🐱 Luna</p>
    <p>Gato</p>
    <button onclick="adoptar('Luna')">Adoptar</button>
  </div>

  <div class="animal">
    <p>🐦 Pico</p>
    <p>Periquito</p>
    <button onclick="adoptar('Pico')">Adoptar</button>
  </div>

  <h2>Solicitud</h2>

  <form onsubmit="enviar(event)">
    <input type="text" id="nombre" placeholder="Tu nombre"><br><br>
    <input type="text" id="telefono" placeholder="Teléfono"><br><br>
    <select id="animal">
      <option>Bruno</option>
      <option>Luna</option>
      <option>Pico</option>
    </select><br><br>
    <button type="submit">Enviar</button>
  </form>

  <p id="mensaje"></p>

  <script>
    function adoptar(nombre) {
      document.getElementById("animal").value = nombre;
      alert("Seleccionaste a " + nombre);
    }

    function enviar(e) {
      e.preventDefault();
      document.getElementById("mensaje").innerText = "Solicitud enviada";
    }
  </script>
  <hr>

  <h3>Integrantes</h3>
  <ul>
    <li>Gudiño Luna Josué Ethianne</li>
    <li>Mendoza Nieto Oscar Osvaldo</li>
    <li>Avila Mendoza Natalia</li>
  </ul>

  <p>IPN ESCOM · Bases de Datos</p>

          </div>
</body>
</html>
